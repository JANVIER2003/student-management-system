<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Student</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/students.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="../images/logo.png" alt="School logo" />
          <div>
            <h2>Student Management System</h2>
          </div>
        </div>

        <nav class="nav-menu">
          <a href="../index.html"><span class="nav-icon">🏠</span>Dashboard</a>
          <a href="students.html"><span class="nav-icon">👨‍🎓</span>Students</a>
          <a href="add-student.html" class="active"><span class="nav-icon">➕</span>Add Student</a>
          <a href="results.html"><span class="nav-icon">📊</span>Results</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Registration</p>
            <h1 id="pageTitle">Add Student</h1>
          </div>
        </header>

        <section class="panel form-panel">
          <form id="studentForm">
            <div class="form-grid">
              <label>
                Student ID
                <input type="text" id="studentId" name="studentId" placeholder="ST001" required />
              </label>

              <label>
                Gender
                <select id="gender" name="gender" required>
                  <option value="">Select Gender</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </label>

              <label>
                First Name
                <input type="text" id="firstName" name="firstName" placeholder="Enter first name" required />
              </label>

              <label>
                Last Name
                <input type="text" id="lastName" name="lastName" placeholder="Enter last name" required />
              </label>

              <label>
                Date of Birth
                <input type="text" id="dateOfBirth" name="dateOfBirth" placeholder="15/03/2005" required />
              </label>

              <label>
                Email
                <input type="email" id="email" name="email" placeholder="student@gmail.com" required />
              </label>

              <label>
                Phone
                <input type="tel" id="phone" name="phone" placeholder="0781234567" required />
              </label>

              <label>
                Programme
                <select id="programme" name="programme" required>
                  <option value="">Select Programme</option>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Software Engineering">Software Engineering</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Business Information Technology">Business Information Technology</option>
                </select>
              </label>

              <label>
                Year
                <select id="year" name="year" required>
                  <option value="">Select Year</option>
                  <option value="Year 1">Year 1</option>
                  <option value="Year 2">Year 2</option>
                  <option value="Year 3">Year 3</option>
                  <option value="Year 4">Year 4</option>
                </select>
              </label>
            </div>

            <div class="form-actions">
              <button type="reset" class="btn btn-secondary">🧹 Clear</button>
              <button type="submit" id="submitButton" class="btn btn-primary">💾 Save Student</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="../data/students.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/students.js"></script>
  </body>
</html>
