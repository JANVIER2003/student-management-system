<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/students.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="../images/logo.png" alt="School logo" />
          <div>
            <h2>Student Management System</h2>
          </div>
        </div>

        <nav class="nav-menu">
          <a href="../index.html"><span class="nav-icon">🏠</span>Dashboard</a>
          <a href="students.html" class="active"><span class="nav-icon">👨‍🎓</span>Students</a>
          <a href="add-student.html"><span class="nav-icon">➕</span>Add Student</a>
          <a href="results.html"><span class="nav-icon">📊</span>Results</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Records</p>
            <h1>Student Management</h1>
          </div>
          <div class="topbar-actions">
            <a href="add-student.html" class="btn btn-primary">+ Add Student</a>
          </div>
        </header>

        <section class="toolbar panel">
          <input id="searchInput" type="text" placeholder="Search student by ID, first name or last name" />
          <select id="programmeFilter">
            <option value="All">All Programmes</option>
          </select>
        </section>

        <section class="panel">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Student ID</th>
                  <th>Full Name</th>
                  <th>Gender</th>
                  <th>Programme</th>
                  <th>Year</th>
                  <th>Average</th>
                  <th>Grade</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="studentsTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="../data/students.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/students.js"></script>
  </body>
</html>
